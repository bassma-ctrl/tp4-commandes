<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion des commandes</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-light">
  <main class="container py-4">
    <header class="mb-4">
      <h1>Gestion des commandes</h1>
      <p class="text-secondary">
        Consultation des commandes, des clients et des produits.
      </p>
    </header>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <section class="mb-4" aria-label="Indicateurs">
      <div id="indicators" class="row g-3"></div>
    </section>

    <section class="card mb-4" aria-label="Recherche et filtres">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="search" class="form-label">
              Rechercher par nom du client
            </label>
            <input
              id="search"
              type="search"
              class="form-control"
              placeholder="Exemple : Sara"
            >
          </div>

          <div class="col-md-3">
            <label for="status" class="form-label">Statut</label>
            <select id="status" class="form-select">
              <option value="">Tous les statuts</option>
              <option value="Livree">Livrée</option>
              <option value="En attente">En attente</option>
              <option value="Annulee">Annulée</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="category" class="form-label">Catégorie</label>
            <select id="category" class="form-select">
              <option value="">Toutes les catégories</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section id="details" class="mb-4" aria-label="Détail de la commande"></section>

    <section aria-labelledby="orders-title">
      <h2 id="orders-title" class="h4 mb-3">Les commandes</h2>
      <div id="orders" class="row g-3"></div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
